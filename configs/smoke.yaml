# Tiny config used by CI on synthetic data. Not meant to produce a good model.
seed: 0
device: cpu

data:
  root: data/synthetic
  img_size: 96
  num_workers: 0

model:
  name: mobilenet_v3_small
  pretrained: false
  dropout: 0.2
  bn_momentum: 0.1

train:
  epochs: 6
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0
  amp: false
  patience: 5

output:
  dir: runs/smoke

budget:
  max_params_m: 3.0
  max_fp32_mb: 12.0
  max_int8_mb: 4.0
  max_p50_ms: 500.0     # CI runners are slow and noisy; real budget lives in default.yaml
