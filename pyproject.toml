[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveness-lite"
version = "0.1.0"
description = "Lightweight genuine-vs-spoof image classifier (face presentation attack detection)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_report.py" = ["E501"]  # long prose strings

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
